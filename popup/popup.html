<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upwork Job Matcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header>
      <div class="logo-area">
        <div class="logo-mark">
          <img src="../icons/icon48.png" alt="UJM" width="28" height="28">
        </div>
        <h1>Job Matcher</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Open Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>

    <main>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Jobs Matched</span>
          <span id="jobsCount" class="stat-value">...</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">AI Analysis</span>
          <span id="aiCount" class="stat-value">...</span>
        </div>
      </div>

      <div class="status-indicator">
        <div class="status-dot"></div>
        <span id="statusText">System Active</span>
      </div>
    </main>

    <footer>
      <p>Upwork Job Matcher v1.1.0</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
